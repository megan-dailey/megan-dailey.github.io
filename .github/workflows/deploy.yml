name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publishes dist/ to the gh-pages branch, which GitHub Pages already serves.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
